<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drinking Project Reminder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="reminder-shell" aria-live="polite">
    <div class="video-warning" id="videoWarning" hidden>未找到可播放视频，请检查 视频/视频素材/</div>

    <div class="topline">
      <div class="playback-control" id="playbackControl">
        <label for="playbackModeSelect">播放</label>
        <select id="playbackModeSelect" aria-label="播放方式">
          <option value="advanceOnEnd">播完换下一个</option>
          <option value="loopSelected">单条循环</option>
        </select>
      </div>
      <div class="topline-meta">
        <span>今天 08:00 - 22:00</span>
        <span id="screenRole">主屏幕</span>
      </div>
    </div>

    <section class="ritual" aria-label="喝水提醒">
      <div class="copy-block">
        <p class="status" id="statusText">30 秒后再确认</p>
        <h1>先喝一口水</h1>
        <p class="hint" id="hintText">把杯子拿起来，慢慢喝完这一口。</p>
      </div>

      <div class="action-block">
        <div class="timer" id="countdownText">00:30</div>
        <p class="progress" id="progressText">确认 0 / 3</p>
        <button id="confirmButton" class="confirm" type="button" disabled>等待中</button>
      </div>
    </section>

    <div class="safe-exit">紧急退出 Command + Q</div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
